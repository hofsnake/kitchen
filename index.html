<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;padding:0;background:#000;color:#fff;height:100%;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
button,a.btn{font-family:inherit}
#app{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;min-height:100%;padding:2vmin}
#main{display:-webkit-flex;display:flex;-webkit-flex-direction:row;flex-direction:row;-webkit-flex:1 1 auto;flex:1 1 auto}
.col{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-flex:1 1 0;flex:1 1 0;min-width:0}
.col+.col{margin-left:2vmin}
.card{background:#161616;border:2px solid #2a2a2a;border-radius:2.2vmin;padding:2vmin;margin-bottom:2vmin}
.card:last-child{margin-bottom:0}
.label{font-size:2.4vmin;letter-spacing:.12em;text-transform:uppercase;color:#9a9a9a;margin-bottom:1vmin;font-weight:600}
/* clock */
#time{font-size:17vmin;line-height:1;font-weight:700;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
#ampm{font-size:6vmin;color:#ffb000;margin-left:1vmin;font-weight:600}
#date{font-size:4.6vmin;color:#ddd;margin-top:1.2vmin;font-weight:500}
/* weather */
#wx{display:-webkit-flex;display:flex;-webkit-align-items:baseline;align-items:baseline;-webkit-flex-wrap:wrap;flex-wrap:wrap}
#temp{font-size:11vmin;font-weight:700;line-height:1;color:#7fd6ff}
#cond{font-size:4.6vmin;margin-left:3vmin;color:#fff}
#hilo{font-size:4.2vmin;color:#ddd;margin-top:1vmin}
#wxnote{font-size:2.6vmin;color:#888;margin-top:1vmin}
#wxcard{cursor:pointer}
.wxhead{display:block;margin-bottom:.4vmin}
.wxhead .label{display:inline-block;margin:0 .8vmin 0 0;vertical-align:middle}
.wxmore{display:inline-block;vertical-align:middle;font-size:2vmin;font-weight:700;color:#7fd6ff}
#wxpanel{display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:8;background:#000;color:#fff;overflow:auto;-webkit-overflow-scrolling:touch;padding:2.2vmin}
#wxpanel.on{display:block}
.wxbar{display:table;width:100%;margin:0 0 1.6vmin}
.wxbar .label{display:table-cell;vertical-align:middle;margin:0;font-size:3.2vmin;color:#fff}
#wxclose{display:table-cell;width:28vmin;height:10vmin;min-height:10vmin;line-height:10vmin;vertical-align:middle;font-size:3.6vmin;font-weight:800;padding:0}
#wxnow{font-size:8vmin;font-weight:800;line-height:1}
#wxnow .ic{font-size:7vmin;margin-right:1.2vmin}
#wxmeta{font-size:3.2vmin;color:#ddd;margin-top:.8vmin;line-height:1.35}
#wxhours{white-space:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;margin:.6vmin 0 1.2vmin;font-size:0}
.wxh{display:inline-block;vertical-align:top;width:13vmin;margin:0 .7vmin 0 0;text-align:center;background:#161616;border:2px solid #2a2a2a;border-radius:1.4vmin;padding:1vmin 0}
.wxh .hr{font-size:2.2vmin;color:#bbb}
.wxh .ic{font-size:4.2vmin;line-height:1.25}
.wxh .tp{font-size:3vmin;font-weight:800}
.wxh .pp{font-size:2.2vmin;color:#7fd6ff}
.wxd{display:block;padding:1.1vmin 0;border-bottom:1px solid #2a2a2a;font-size:3.4vmin}
.wxd span{display:inline-block;vertical-align:middle}
.wxd .dn{width:16vmin;font-weight:700}
.wxd .di{width:8vmin;text-align:center;font-size:4vmin}
.wxd .dt{width:30vmin;font-weight:700}
.wxd .dp{color:#7fd6ff}
/* timers */
.timer{background:#101820;border:2px solid #25323f;border-radius:2.2vmin;padding:1.6vmin;margin-bottom:1.6vmin}
.timer:last-child{margin-bottom:0}
.timer.running{border-color:#2ecc71}
.timer.done{border-color:#ff3b30}
.tname{font-size:2.6vmin;color:#9fb4c7;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tdisp{font-size:10vmin;font-weight:700;line-height:1.05;margin:.4vmin 0 1vmin;font-variant-numeric:tabular-nums;white-space:nowrap}
.timer.running .tdisp{color:#2ecc71}
.timer.done .tdisp{color:#ff3b30}
.row{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin:-.6vmin}
.row>*{margin:.6vmin}
.btn{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  min-height:80px;min-width:80px;padding:0 3vmin;font-size:3.8vmin;font-weight:700;color:#fff;background:#2b2b2b;border:2px solid #444;
  border-radius:2vmin;text-decoration:none;text-align:center;cursor:pointer;-webkit-appearance:none;appearance:none}
.btn:active{background:#555}
.btn.add{-webkit-flex:1 1 0;flex:1 1 0;padding:0 1vmin;background:#1d3550;border-color:#2f5a8a}
.btn.go{-webkit-flex:1.6 1 0;flex:1.6 1 0;padding:0 1vmin;background:#1f7a3f;border-color:#2ecc71}
.btn.pause{background:#8a5a00;border-color:#ffb000}
.btn.rst{-webkit-flex:1.4 1 0;flex:1.4 1 0;padding:0 1vmin;font-size:3.4vmin;background:#3a1d1d;border-color:#7a3030}
.none{color:#aaa;font-size:3.8vmin}
/* on tv */
#tvcard{background:#0a2f86;border-color:#1d4eae;overflow:hidden}
#tvcard .tvhead{display:table;width:100%;margin:0 0 .5vmin;table-layout:fixed}
#tvcard .tvhead .label{display:table-cell;vertical-align:middle;margin:0;color:#ffe14a;font-family:Impact,"Arial Black",Arial,Helvetica,sans-serif;font-size:3.2vmin;letter-spacing:.04em}
#tvcard .btn.ask{display:table-cell;width:22vmin;height:4.2vmin;min-height:4.2vmin;line-height:4.2vmin;padding:0;vertical-align:middle;border-radius:999px;background:#1d9bf0;border-color:#5bb8f5;font-size:1.9vmin;text-align:center}
#tvcols{display:table;width:100%;table-layout:fixed}
.tvcol{display:table-cell;vertical-align:top;width:33%;padding:0 .35vmin}
.tvcol .box{background:#071f5c;border:2px solid #143e9a;border-radius:1.2vmin;padding:.5vmin .4vmin .6vmin;min-height:18vmin}
.tvcol.today .box{background:#123a8f;border-color:#ffe14a}
.tvwhen{display:block;text-align:center;color:#ffe14a;font-family:Impact,"Arial Black",Arial,Helvetica,sans-serif;font-size:2.3vmin;letter-spacing:.04em;line-height:1.1}
.tvdate{display:block;text-align:center;color:#d6e2ff;font-size:1.9vmin;margin:0 0 .4vmin}
.tvitem{display:block;margin:0 0 .55vmin;padding:.2vmin 0;border-top:1px solid #1d4eae}
.tvtime{display:block;color:#ffe14a;font-size:20px;font-weight:800;line-height:1.15}
.tvname{display:block;color:#fff;font-size:21px;font-weight:700;line-height:1.2}
.tvwhere{display:block;color:#b9d0ff;font-size:16px;line-height:1.2}
.tvempty{display:block;color:#9db4e6;font-size:20px;font-weight:700;text-align:center;margin-top:.8vmin}
/* seasonal mascot */
#mascot{position:fixed;left:0;top:0;width:78px;height:88px;z-index:6;pointer-events:none;opacity:.78;-webkit-transition:none;transition:none}
#mascot.off{display:none}
#mascot .bob{-webkit-animation:mascotbob .7s ease-in-out infinite alternate;animation:mascotbob .7s ease-in-out infinite alternate}
#mascot .bob{-webkit-animation:none;animation:none}
#mascot.paused .bob{-webkit-animation-play-state:paused;animation-play-state:paused}
@-webkit-keyframes mascotbob{0%{-webkit-transform:translateY(0) rotate(-7deg)}100%{-webkit-transform:translateY(-6px) rotate(7deg)}}
@keyframes mascotbob{0%{transform:translateY(0) rotate(-7deg)}100%{transform:translateY(-6px) rotate(7deg)}}
/* links */
#links .btn{width:100%;min-height:80px;font-size:3.8vmin;background:#222;border-color:#555}
#links .btn.foodie{background:#e8772e;border-color:#ffa060}
/* music */
#music .btn.pandora{width:100%;background:#102a4c;border-color:#4c8dff;min-height:80px;font-size:3.8vmin}
#music .btn.station{-webkit-flex:1 1 42%;flex:1 1 42%;background:#121a28;border-color:#3d5a80;white-space:normal;line-height:1.15;text-align:center;padding:1vmin 1.4vmin}
#music #stations:not(:empty){margin-top:1vmin}
/* recipes */
#home>.card:last-child{margin-bottom:0}
#recipes{display:none}
.recipe-bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
.recipe-bar .label{-webkit-flex:1 1 auto;flex:1 1 auto;margin:0 1vmin .6vmin 0;font-size:3.2vmin;color:#fff}
.recipe-bar .btn{-webkit-flex:0 0 auto;flex:0 0 auto;min-height:9vmin;margin:0 .6vmin .6vmin 0;padding:0 2.2vmin;font-size:3vmin}
#recipe-back[hidden]{display:none}
#recipe-drive{background:#3a2416;border-color:#ffa060}
.recipe-list{overflow:auto;-webkit-overflow-scrolling:touch;-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0;margin-top:.6vmin}
.recipe-list .btn{width:auto;height:auto;font-weight:700;white-space:normal;line-height:1.15;text-align:center}
#recipes.show-cats .recipe-list,#recipes.show-list .recipe-list{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-align-content:stretch;align-content:stretch}
#recipes.show-cats .recipe-list .btn{-webkit-flex:1 1 42%;flex:1 1 42%;min-height:22vmin;margin:.7vmin;padding:1.4vmin;font-size:3.8vmin;background:#2a2118;border-color:#e8772e}
#recipes.show-list .recipe-list{-webkit-align-content:flex-start;align-content:flex-start}
#recipes.show-list .recipe-list .btn{-webkit-flex:1 1 100%;flex:1 1 100%;min-height:12vmin;margin:.55vmin 0;padding:1.2vmin 2vmin;font-size:3.3vmin;background:#222;border-color:#555}
#recipe-frame,.recipe-pages{display:none;width:100%;min-height:0;margin-top:1vmin;border:0;border-radius:1.4vmin;background:#111}
.recipe-pages{overflow:auto;-webkit-overflow-scrolling:touch}
.recipe-pages canvas{display:block;width:100%;height:auto;margin:0 auto 1.2vmin;background:#fff}
.recipe-pages .none{padding:3vmin}
#recipes.show-file .recipe-list{display:none}
#recipes.show-file .recipe-pages:not([hidden]){display:block;-webkit-flex:1 1 auto;flex:1 1 auto}
#recipes.show-file #recipe-frame:not([hidden]){display:block;-webkit-flex:1 1 auto;flex:1 1 auto;min-height:34vmin}
body.recipes-open #home{display:none}
body.recipes-open #recipes{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-flex:1 1 auto;flex:1 1 auto;min-height:0;height:100%;margin-bottom:0;overflow:hidden}
/* alarm overlay */
#alarm{display:none;position:fixed;left:0;top:0;right:0;bottom:0;z-index:9;background:#ff3b30;color:#fff;
  -webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;
  -webkit-flex-direction:column;flex-direction:column;text-align:center;padding:4vmin}
#alarm.on{display:-webkit-flex;display:flex}
#alarm.alt{background:#fff;color:#c00}
#alarm .big{font-size:16vmin;font-weight:800}
#alarm .sm{font-size:6vmin;margin-top:2vmin}
/* portrait: stack */
@media (orientation:portrait){
  #main{-webkit-flex-direction:column;flex-direction:column}
  .col+.col{margin-left:0;margin-top:2vmin}
  #time{font-size:22vmin}
  .tdisp{font-size:15vmin}
  .btn{font-size:3.6vmin}
}

/* fit one screen */
html,body{height:100%;overflow:hidden}
#app{height:100%;min-height:0;padding:1.5vmin}
#main{min-height:0}
.card{padding:1vmin;margin-bottom:.8vmin}
.col+.col{margin-left:1.5vmin}
.label{font-size:2vmin;margin-bottom:.6vmin}
#time{font-size:12vmin}
#ampm{font-size:5vmin}
#date{font-size:3.6vmin;margin-top:.6vmin}
#temp{font-size:8.5vmin}
#cond{font-size:3.8vmin}
#hilo{font-size:3.4vmin;margin-top:.4vmin}
#wxnote{font-size:2.2vmin;margin-top:.3vmin}
.timer{padding:1vmin;margin-bottom:.7vmin}
.tdisp{font-size:7.2vmin;margin:.2vmin 0 .5vmin}
.btn{min-height:6.4vmin;font-size:2.8vmin}
.btn.rst{font-size:2.8vmin}
#links .btn{min-height:9vmin;font-size:3.4vmin}
#links .btn.foodie{background:#e8772e;border-color:#ffa060}
#music .btn.pandora{min-height:9vmin;font-size:3.4vmin}
#music.has-stations .btn.pandora{min-height:7vmin;font-size:3vmin}
#music #stations:not(:empty){margin-top:.6vmin}
#music .btn.station{min-height:8.2vmin;font-size:2.5vmin}
#app{height:100%;min-height:0;padding:1.2vmin}
@media (orientation:portrait){
  html,body{overflow:auto}
  #time{font-size:18vmin}.tdisp{font-size:12vmin}
  .col+.col{margin-left:0;margin-top:1.5vmin}
  body.recipes-open #recipes{height:auto;overflow:visible}
  #recipes.show-cats .recipe-list .btn{min-height:20vmin}
  #recipes.show-file .recipe-pages:not([hidden]),#recipes.show-file #recipe-frame:not([hidden]){-webkit-flex:none;flex:none;height:62vmin;min-height:62vmin}
}
</style>
</head>
<body>
<div id="mascot" class="off" aria-hidden="true"><div class="face"><div class="bob"></div></div></div>
<div id="app">
 <div id="main">
  <div class="col" id="home-col">
   <div id="home">
    <div class="card">
      <div id="time">--:--<span id="ampm"></span></div>
      <div id="date">&nbsp;</div>
    </div>
    <div class="card" id="wxcard">
      <div class="wxhead"><div class="label">San Angelo, TX</div><div class="wxmore">Forecast</div></div>
      <div id="wx"><span id="temp">--&deg;</span><span id="cond">Loading weather</span></div>
      <div id="hilo">&nbsp;</div>
      <div id="wxnote"></div>
    </div>
<div class="card" id="links">
      <div class="label">Go to</div>

/* ---------- Clock ---------- */
var tfmt=null,dfmt=null,ymd=null;

}
var lastMin="";
function tickClock(){

/* ---------- Weather ---------- */
var WX={0:"Clear",1:"Mostly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",
56:"Freezing drizzle",57:"Freezing drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",66:"Freezing rain",67:"Freezing rain",
71:"Light snow",73:"Snow",75:"Heavy snow",77:"Snow grains",80:"Light showers",81:"Showers",82:"Heavy showers",85:"Snow showers",86:"Snow showers",
95:"Thunderstorm",96:"Thunderstorm, hail",99:"Thunderstorm, hail"};
var WURL="https://api.open-meteo.com/v1/forecast?latitude=31.4638&longitude=-100.4370&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m&hourly=temperature_2m,weather_code,precipitation_probability&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=America%2FChicago&forecast_days=7";
var lastWx=null;
function wxIcon(code){
  if(code===0||code===1)return "\u2600";
  if(code===2)return "\u26C5";
  if(code===3)return "\u2601";
  if(code===45||code===48)return "\u2261";
  if((code>=71&&code<=77)||code===85||code===86)return "\u2744";
  if(code>=95)return "\u26A1";
  if(code>=51)return "\u2614";
  return "\u2601";
}
function rainTxt(p){
  if(p==null||p!==p)return "\u2014";
  return Math.round(p)+"% rain";
}
function hourLabel(iso){
  var h=parseInt(String(iso).slice(11,13),10);
  var ap=h<12?"AM":"PM", hr=h%12;
  if(isNaN(h))return "";
  if(hr===0)hr=12;
  return hr+" "+ap;
}
function dayLabel(iso){
  var p=String(iso).split("-"), dt, days;
  if(p.length<3)return iso;
  dt=new Date(Date.UTC(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),18,0,0));
  days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  try{return new Intl.DateTimeFormat("en-US",{timeZone:"UTC",weekday:"short"}).format(dt);}catch(e){return days[dt.getUTCDay()];}
}
function chiKey(d){
  var s,p,month,day,year,hour;
  try{s=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour12:false,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit"}).format(d);}catch(e){return "";}
  p=s.match(/(\d+)/g);
  if(!p||p.length<4)return "";
  month=p[0];day=p[1];year=p[2];hour=p[3];
  if(hour==="24")hour="00";
  if(month.length<2)month="0"+month;
  if(day.length<2)day="0"+day;
  if(hour.length<2)hour="0"+hour;
  return year+"-"+month+"-"+day+"T"+hour;
}
function showWx(w,stale){
  lastWx=w;

}
function renderForecast(w){
  var box=$("wxbody"), h="", i, row, hours, days;
  if(!box)return;
  if(!w){box.innerHTML='<div class="none">Forecast unavailable</div>';return;}
  h='<div id="wxnow"><span class="ic">'+wxIcon(w.c)+'</span>'+Math.round(w.t)+'\u00B0</div>';
  h+='<div id="wxmeta">'+esc(WX[w.c]||"")+'<br>Feels like '+(w.feel==null?"\u2014":Math.round(w.feel)+"\u00B0");
  h+='<br>Wind '+(w.wind==null?"\u2014":Math.round(w.wind)+" mph")+'</div>';

  }
  h+='</div><div class="label">7 days</div>';
  days=w.days||[];
  if(!days.length)h+='<div class="none">Daily forecast unavailable</div>';
  for(i=0;i<days.length;i++){
    row=days[i];
    h+='<div class="wxd"><span class="dn">'+esc(row.d)+'</span><span class="di">'+wxIcon(row.c)+'</span><span class="dt">'+Math.round(row.hi)+'\u00B0 / '+Math.round(row.lo)+'\u00B0</span><span class="dp">'+esc(rainTxt(row.p))+'</span></div>';

function loadWx(){
  xhr(WURL,function(err,j){
    var d,t,w,hours,days,key,start,i,n,hi,lo;
    if(err||!j||!j.current||!j.daily){
      var c=lsGet("k_wx");
      if(c){showWx(c,true);}
      else{$("cond").firstChild.nodeValue="Weather unavailable";$("temp").firstChild.nodeValue="--\u00B0";}
      return;
    }
    d=new Date();
    t=tfmt?tfmt.format(d):pad(d.getHours())+":"+pad(d.getMinutes());
    hours=[];
    if(j.hourly&&j.hourly.time){
      key=chiKey(d);
      start=0;
      for(i=0;i<j.hourly.time.length;i++){
        if(!key||String(j.hourly.time[i]).slice(0,13)>=key){start=i;break;}
      }
      n=j.hourly.time.length-start;
      if(n>12)n=12;
      for(i=0;i<n;i++){
        hours.push({h:hourLabel(j.hourly.time[start+i]), t:j.hourly.temperature_2m[start+i], c:j.hourly.weather_code[start+i], p:j.hourly.precipitation_probability[start+i]});
      }
    }
    days=[];
    if(j.daily&&j.daily.time){
      n=j.daily.time.length;
      if(n>7)n=7;
      for(i=0;i<n;i++){
        hi=j.daily.temperature_2m_max[i];
        lo=j.daily.temperature_2m_min[i];
        days.push({d:dayLabel(j.daily.time[i]), hi:hi, lo:lo, c:j.daily.weather_code?j.daily.weather_code[i]:0, p:j.daily.precipitation_probability_max?j.daily.precipitation_probability_max[i]:null});
      }
    }
    w={t:j.current.temperature_2m,c:j.current.weather_code,hi:j.daily.temperature_2m_max[0],lo:j.daily.temperature_2m_min[0],at:t,feel:j.current.apparent_temperature,wind:j.current.wind_speed_10m,hours:hours,days:days};
    lsSet("k_wx",w);showWx(w,false);
  });
}

/* ---------- Audio ---------- */
var AC=null;
function unlockAudio(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    if(!C)return;
    if(!AC)AC=new C();
    if(AC.state==="suspended"&&AC.resume)AC.resume();
  }catch(e){}
}
function beepBurst(){
  if(!AC)return;
  try{
    var now=AC.currentTime,i;
    for(i=0;i<3;i++){
      var o=AC.createOscillator(),g=AC.createGain();
      o.type="square";o.frequency.value=i%2?988:880;
      g.gain.setValueAtTime(0.0001,now+i*0.22);
      g.gain.linearRampToValueAtTime(0.9,now+i*0.22+0.01);
      g.gain.setValueAtTime(0.9,now+i*0.22+0.15);
      g.gain.linearRampToValueAtTime(0.0001,now+i*0.22+0.18);
      o.connect(g);g.connect(AC.destination);
      o.start(now+i*0.22);o.stop(now+i*0.22+0.2);
    }
  }catch(e){}
}
document.addEventListener("touchstart",unlockAudio,false);
document.addEventListener("click",unlockAudio,false);

/* ---------- Timers ---------- */
var NAMES=["Timer 1","Timer 2"];
var T=lsGet("k_timers");
if(!T||T.length!==2)T=[{rem:0,end:0,run:false,done:false},{rem:0,end:0,run:false,done:false}];
function save(){lsSet("k_timers",T);}
function fmt(ms){
  var s=Math.ceil(ms/1000);if(s<0)s=0;
  var h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  return h>0?h+":"+pad(m)+":"+pad(sec):pad(m)+":"+pad(sec);
}
function left(t){return t.run?Math.max(0,t.end-Date.now()):t.rem;}
function buildTimers(){
  var h="",i;
  for(i=0;i<2;i++){
    h+='<div class="timer" id="t'+i+'"><div class="tname">'+NAMES[i]+'</div><div class="tdisp" id="d'+i+'">00:00</div>'+
    '<div class="row"><button class="btn add" data-a="add" data-i="'+i+'" data-m="1">+1</button>'+
    '<button class="btn add" data-a="add" data-i="'+i+'" data-m="5">+5</button>'+
    '<button class="btn add" data-a="add" data-i="'+i+'" data-m="10">+10</button>'+
    '<button class="btn go" id="g'+i+'" data-a="go" data-i="'+i+'">Start</button>'+
    '<button class="btn rst" data-a="reset" data-i="'+i+'">Reset</button></div></div>';
  }
  $("timers").innerHTML=h;
}
function paint(){
  var i;
  for(i=0;i<2;i++){
    var t=T[i],el=$("t"+i),l=left(t);
    $("d"+i).firstChild.nodeValue=t.done?"00:00":fmt(l);
    el.className="timer"+(t.run?" running":"")+(t.done?" done":"");
    var g=$("g"+i);
    g.firstChild.nodeValue=t.run?"Pause":"Start";
    g.className="btn go"+(t.run?" pause":"");
  }
}
var ringing=-1,ringStart=0,beepTimer=null,flashTimer=null;
function startAlarm(i){
  if(ringing>=0)return;
  ringing=i;ringStart=Date.now();
  $("alarmname").firstChild.nodeValue=NAMES[i];
  $("alarm").className="on";
  unlockAudio();beepBurst();
  beepTimer=setInterval(function(){
    if(Date.now()-ringStart>90000){stopAlarm();return;}
    beepBurst();
  },900);
  var alt=false;
  flashTimer=setInterval(function(){alt=!alt;$("alarm").className=alt?"on alt":"on";},450);
  if(navigator.vibrate){try{navigator.vibrate([400,200,400]);}catch(e){}}
}
function stopAlarm(){
  if(beepTimer){clearInterval(beepTimer);beepTimer=null;}
  if(flashTimer){clearInterval(flashTimer);flashTimer=null;}
  $("alarm").className="";
  if(ringing>=0){T[ringing].done=false;T[ringing].rem=0;save();}
  ringing=-1;paint();
}
$("alarm").addEventListener("click",stopAlarm,false);
$("alarm").addEventListener("touchend",function(e){e.preventDefault();stopAlarm();},false);

function checkTimers(){
  var i,t;
  for(i=0;i<2;i++){
    t=T[i];
    if(t.run&&Date.now()>=t.end){t.run=false;t.rem=0;t.done=true;save();startAlarm(i);}
  }
  paint();
}
function act(a,i,m){
  var t=T[i];
  unlockAudio();
  if(t.done&&a!=="reset"){t.done=false;t.rem=0;}
  if(a==="add"){
    if(t.run)t.end+=m*60000;else t.rem+=m*60000;
    if(t.rem>99*3600000)t.rem=99*3600000;
  }else if(a==="go"){
    if(t.run){t.rem=Math.max(0,t.end-Date.now());t.run=false;}
    else if(t.rem>0){t.end=Date.now()+t.rem;t.run=true;}
  }else if(a==="reset"){
    t.run=false;t.rem=0;t.end=0;t.done=false;
    if(ringing===i)stopAlarm();
  }
  save();paint();
}
$("timers").addEventListener("click",function(e){
  var n=e.target;
  while(n&&n!==this&&!(n.getAttribute&&n.getAttribute("data-a")))n=n.parentNode;
  if(!n||n===this)return;
  act(n.getAttribute("data-a"),parseInt(n.getAttribute("data-i"),10),parseInt(n.getAttribute("data-m")||"0",10));
},false);

function renderPdf(url,title){
  var job=++pdfJob,pages=$("recipe-pages"),frame=$("recipe-frame");
  if(frame){frame.hidden=true;frame.removeAttribute("src");}
  if(!pages||!window.pdfjsLib){showPdfFrame(url,title);return;}
  pages.hidden=false;
  pages.innerHTML='<div class="none">Opening recipe…</div>';
  pages.scrollTop=0;
  try{pdfjsLib.GlobalWorkerOptions.workerSrc="pdfjs/pdf.worker.min.js?v="+KITCHEN_BUILD;}catch(e){}
  pdfjsLib.getDocument({url:url,disableRange:true,disableStream:true}).promise.then(function(pdf){
    var n;
    if(job!==pdfJob)return;
    pages.innerHTML="";
    n=1;
    function step(){
      if(job!==pdfJob)return;
      if(n>pdf.numPages)return;
      var num=n++;
      pdf.getPage(num).then(function(page){
        var canvas,base,dpr,scale,viewport,width;
        if(job!==pdfJob)return;
        canvas=document.createElement("canvas");
        pages.appendChild(canvas);
        width=pages.clientWidth||pages.offsetWidth||480;
        if(width<80)width=480;
        base=page.getViewport({scale:1});
        dpr=window.devicePixelRatio||1;
        if(dpr>2)dpr=2;
        scale=(width-2)/base.width;
        viewport=page.getViewport({scale:scale*dpr});
        canvas.width=Math.floor(viewport.width);
        canvas.height=Math.floor(viewport.height);
        canvas.style.width="100%";
        canvas.style.height="auto";
        page.render({canvasContext:canvas.getContext("2d",{alpha:false}),viewport:viewport}).promise.then(step,step);
      },step);
    }
    step();
  },function(){
    if(job!==pdfJob)return;
    showPdfFrame(url,title);
  });
}

/* ---------- TV ---------- */
var TVDAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var TVMONTHS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function timeKey(t){
  var s,m,h,min,ap;
  s=String(t==null?"":t).replace(/^\s+|\s+$/g,"");
  if(!s||/^all day$/i.test(s))return -1;
  m=/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i.exec(s);
  if(!m)return 24*60;
  h=parseInt(m[1],10);min=m[2]?parseInt(m[2],10):0;ap=m[3].toUpperCase();
  if(ap==="PM"&&h<12)h+=12;
  if(ap==="AM"&&h===12)h=0;
  return h*60+min;
}
function chiWeekday(iso){
  var p=String(iso||"").split("-"),dt;
  if(p.length<3)return -1;
  dt=new Date(Date.UTC(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10),18,0,0));
  return dt.getUTCDay();
}
function shortDate(iso){
  var p=String(iso||"").split("-"),m,d;
  m=parseInt(p[1],10);d=parseInt(p[2],10);
  if(!m||!d)return iso;
  return TVMONTHS[m-1]+" "+d;
}
function tvItemText(it,showDate){
  var parts=[],name;
  if(showDate&&it.date)parts.push(shortDate(it.date));
  if(it.time)parts.push(it.time);
  name=it.show||"";
  if(it.where)name+=" ("+it.where+")";
  parts.push(name);
  return parts.join("  ");
}
function tvSort(a,b){
  if(a.date!==b.date)return a.date<b.date?-1:1;
  return timeKey(a.time)-timeKey(b.time);
}
function shiftIso(iso,days){
  var p=String(iso||"").split("-"),dt,y,m,d;
  if(p.length<3)return iso;
  dt=new Date(Date.UTC(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10)+days,18,0,0));
  y=dt.getUTCFullYear();m=dt.getUTCMonth()+1;d=dt.getUTCDate();
  return y+"-"+(m<10?"0"+m:m)+"-"+(d<10?"0"+d:d);
}
function prettyDay(iso){
  var wd=chiWeekday(iso);
  return (wd>=0?TVDAYS[wd]+" ":"")+shortDate(iso);
}
function showsOn(data,iso){
  var day=chiWeekday(iso),out=[],weekly,dated,i,it;
  weekly=(data&&data.weekly)||[];
  dated=(data&&data.dated)||[];
  for(i=0;i<weekly.length;i++){
    it=weekly[i];
    if(!it||it.day!==day)continue;
    out.push({time:it.time||"",show:it.show||"",where:it.where||""});
  }
  for(i=0;i<dated.length;i++){
    it=dated[i];
    if(!it||it.date!==iso)continue;
    out.push({time:it.time||"",show:it.show||"",where:it.where||""});
  }
  out.sort(function(a,b){return timeKey(a.time)-timeKey(b.time);});
  return out;
}
function renderTvCol(id,title,iso,items){
  var el=$(id),h="",i,it,time;
  if(!el)return;
  h='<div class="tvwhen">'+title+'</div><div class="tvdate">'+esc(prettyDay(iso))+'</div>';
  if(!items.length)h+='<div class="tvempty">Nothing listed</div>';
  for(i=0;i<items.length;i++){
    it=items[i];
    time=it.time?it.time:"All day";
    h+='<div class="tvitem"><div class="tvtime">'+esc(time)+'</div><div class="tvname">'+esc(it.show)+'</div>';
    if(it.where)h+='<div class="tvwhere">'+esc(it.where)+'</div>';
    h+='</div>';
  }
  el.innerHTML=h;
}
function renderTvBoard(data){
  var today=todayStr();
  renderTvCol("tv-yday","YESTERDAY",shiftIso(today,-1),showsOn(data,shiftIso(today,-1)));
  renderTvCol("tv-today","TODAY",today,showsOn(data,today));
  renderTvCol("tv-tom","TOMORROW",shiftIso(today,1),showsOn(data,shiftIso(today,1)));
}
function loadTv(){

    lsSet("k_tv",j);

}

/* ---------- Mascot ---------- */
/* Add a season by appending {id, from, to, svg}. from/to are MM-DD or thanksgiving / day-after-thanksgiving. */
var SEASONS=[
  {id:"thanksgiving", from:"11-01", to:"thanksgiving", svg:"turkey"},
  {id:"christmas", from:"day-after-thanksgiving", to:"12-26", svg:"santa"}
];
var MASCOT_SVG={
  turkey:'<svg viewBox="0 0 80 96" width="80" height="96" aria-hidden="true"><ellipse cx="22" cy="40" rx="12" ry="18" fill="#e07a2f" transform="rotate(-28 22 40)"/><ellipse cx="58" cy="40" rx="12" ry="18" fill="#d4532a" transform="rotate(28 58 40)"/><ellipse cx="40" cy="28" rx="14" ry="16" fill="#f0a04a"/><ellipse cx="40" cy="50" rx="22" ry="24" fill="#c4622d"/><ellipse cx="40" cy="54" rx="13" ry="15" fill="#f6d7ae"/><circle cx="40" cy="32" r="11" fill="#e8b56a"/><ellipse cx="48" cy="34" rx="7" ry="4" fill="#f4c14d"/><circle cx="35" cy="30" r="2" fill="#222"/><path d="M33 36 q7 6 14 0" fill="#c23b3b"/><path d="M40 74 q5 8 0 16" stroke="#eee" fill="none" stroke-width="1.6"/></svg>',
  santa:'<svg viewBox="0 0 80 96" width="80" height="96" aria-hidden="true"><path d="M18 40 L40 8 L66 38 Z" fill="#d0122d"/><circle cx="64" cy="16" r="6" fill="#fff"/><rect x="14" y="34" width="52" height="10" rx="5" fill="#fff"/><circle cx="40" cy="54" r="18" fill="#f3c7a1"/><circle cx="33" cy="52" r="2.2" fill="#222"/><circle cx="47" cy="52" r="2.2" fill="#222"/><ellipse cx="40" cy="64" rx="16" ry="10" fill="#fff"/><circle cx="40" cy="58" r="3.5" fill="#e07070"/></svg>'
};
var mascotTimer=null, mascotOn=false, mascotX=12;
function thanksgivingDay(year){
  var wd=new Date(Date.UTC(year,10,1,18,0,0)).getUTCDay();
  return 1+((4-wd+7)%7)+21;
}
function seasonPoint(token,year){
  var p,m,d;
  if(token==="thanksgiving")return year+"-11-"+(thanksgivingDay(year)<10?"0":"")+thanksgivingDay(year);
  if(token==="day-after-thanksgiving"){
    d=thanksgivingDay(year)+1;
    return year+"-11-"+(d<10?"0":"")+d;
  }
  p=String(token).split("-");
  m=parseInt(p[0],10);d=parseInt(p[1],10);
  return year+"-"+(m<10?"0"+m:m)+"-"+(d<10?"0"+d:d);
}
function activeSeason(today){
  var year=parseInt(String(today).slice(0,4),10),i,s,a,b;
  if(!year)return null;
  for(i=0;i<SEASONS.length;i++){
    s=SEASONS[i];
    a=seasonPoint(s.from,year);
    b=seasonPoint(s.to,year);
    if(today>=a&&today<=b)return s;
  }
  return null;
}
function mascotEdge(){
  var w=window.innerWidth||1024,h=window.innerHeight||768,pad=6,side,x,y;
  side=Math.floor(Math.random()*4);
  if(side===0){x=pad+Math.random()*(w-84);y=pad;}
  else if(side===1){x=w-84;y=pad+Math.random()*(h-94);}
  else if(side===2){x=pad+Math.random()*(w-84);y=h-94;}
  else{x=pad;y=pad+Math.random()*(h-94);}
  if(x<pad)x=pad;
  if(y<pad)y=pad;
  return {x:Math.round(x),y:Math.round(y)};
}
function mascotScoot(){
  var el,face,p,flip,t;
  if(document.hidden||!mascotOn){mascotTimer=null;return;}
  el=$("mascot");
  if(!el)return;
  p=mascotEdge();
  flip=p.x<mascotX?-1:1;
  mascotX=p.x;
  t="translate3d("+p.x+"px,"+p.y+"px,0)";
  el.style.webkitTransform=t;
  el.style.transform=t;
  face=el.getElementsByTagName("div")[0];
  if(face){face.style.webkitTransform="scaleX("+flip+")";face.style.transform="scaleX("+flip+")";}
  mascotTimer=setTimeout(mascotScoot,300000);
}
function bootMascot(){
  var season=activeSeason(todayStr()),el,bob;
  el=$("mascot");
  if(!el)return;
  if(!season||!MASCOT_SVG[season.svg]){el.className="off";mascotOn=false;return;}
  bob=el.getElementsByTagName("div");
  if(bob.length>1)bob[1].innerHTML=MASCOT_SVG[season.svg];
  el.className="on "+season.id;
  mascotOn=true;
  mascotScoot();
}
document.addEventListener("visibilitychange",function(){
  var el=$("mascot");
  if(!mascotOn||!el)return;
  if(document.hidden){
    if(mascotTimer){clearTimeout(mascotTimer);mascotTimer=null;}
    el.className=el.className+" paused";
  }else{
    el.className=el.className.replace(/\bpaused\b/g,"").replace(/\s+/g," ");
    if(!mascotTimer)mascotScoot();
  }
},false);
